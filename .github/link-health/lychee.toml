# lychee settings for the scheduled link-health workflow
# (.github/workflows/link-health.yml).
#
# The Docusaurus build already fails on broken internal links
# (onBrokenLinks: "throw"), so this check covers web links only. The workflow
# passes --root-dir static, which turns root-relative links (/assets/...)
# into local file links. The scheme filter below then skips them.

scheme = ["https", "http"]

no_progress = true
max_concurrency = 16
host_concurrency = 4
max_retries = 2
retry_wait_time = 2
timeout = 30

# HTTP 429 means that the host limits automated requests, not that the link
# is broken.
accept = ["200..=299", "429"]

# Keep results between runs on the same day, but never keep a failure.
cache = true
max_cache_age = "1d"
cache_exclude_status = ["400..=599"]

exclude_all_private = true
exclude = [
  # scripts/link-health/pointers.mjs checks Discord invites with the Discord API.
  '^https?://(www\.)?discord(app)?\.(com|gg)/',
  # Local and placeholder hosts in code samples.
  '^https?://localhost',
  '^https?://127\.0\.0\.1',
  '^https?://0\.0\.0\.0',
  '^https?://(www\.)?example\.(com|org|net)',
  '^https?://example\.[a-z.]+(:\d+)?/',
  # Hosts that answer automated requests with HTTP 403.
  '^https://codeanywhere\.com/',
  '^https://(www\.)?investopedia\.com/',
  '^https://stackoverflow\.com/',
]
