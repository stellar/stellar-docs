# Entornos de vista previa de relaciones públicas, reemplazando la tubería de vista previa de Jenkins
# (jenkinsfile-stellar-docs-preview). CI solo construye la imagen y las señales con el
# etiqueta 'preview'; ArgoCD's preview-developers ApplicationSet
# (stellar/kube) hace el despliegue.
# Ver https://github.com/stellar/actions/tree/main/sdf-pr-preview

nombre: PR-Preview

en:
 pull_request_target  :
 tipos  : [abierto, sincronizar, Reabierto., Cerrado, etiquetado]

# pull_request_target se ejecuta en contexto base-repo, por lo que estos son escritura real
# permisos incluso para PRs de bifurcación. En 'pull_request', las tiradas de fork no obtienen OIDC
# token y un token de solo lectura.
Permisos.:
  contenidos  : leer
 id-token-token id-token : e scribirscribir   solicitudes de extracción.   
  solicitudes de extracción. : escribir

concurrencia.:
  grupo  : PR-Preview-${{ github.event.pull_request.number }}
  Cancelar en progreso  : Verdadero

Env.:
 Ecr_repository  : Dev/Stellar-docs
 Preview_host  : desarrolladores-PR-${{ github.event.pull_request.number }}.previews.kube001.services.stellar-ops.com

trabajos:
 Vista previa  :
    # 'etiquetado' es solo para la aprobación del mantenedor de relaciones públicas cuyo autor no es un
    # org member (la app estelar-triage-bot). Cualquier otra etiqueta no debe volver a ejecutarse.
    # la puerta: retira la etiqueta 'preview' y se llevaría en vivo
    # vista previa hacia abajo.
 Si  : github.event.action!= "etiquetado" || github.event.label.name == 'preview-approved'
 Run-on  : Ubuntu-últimabuntu-último
    steps:
      # Nothing that touches PR code may run before the gate, and every step
      # after it must be guarded by `member == 'true'`.
      - id: gate
        uses: stellar/actions/sdf-pr-preview/gate@main
        with:
          app-id: ${{ vars.PREVIEW_BOT_APP_ID }}
          private-key: ${{ secrets.PREVIEW_BOT_PRIVATE_KEY }}
          # An org member applies this to approve one preview build of the
          # current head; a later push needs a fresh approval.
          approval-label: preview-approved

      # PR head SHA, not the default base ref - must match the
      # ApplicationSet's {{ .head_sha }}.
      - uses: actions/checkout@v6
        if: steps.gate.outputs.member == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - id: ecr-login
        if: steps.gate.outputs.member == 'true'
        uses: stellar/actions/sdf-ecr-login@main

      - name: Build and push preview image
        if: steps.gate.outputs.member == 'true'
        env:
          TAG: ${{ steps.ecr-login.outputs.ecr-registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.gate.outputs.image-tag }}
        run: |
          set -eu
          make docker-build
          make docker-push
          echo "IMAGE=${TAG}" >> "$GITHUB_ENV"

      - uses: stellar/actions/sdf-pr-preview/publish@main
        if: steps.gate.outputs.member == 'true'
        with:
          images: ${{ env.IMAGE }}
          preview-host: ${{ env.PREVIEW_HOST }}
