name: Link health

# Weekly check of the links and pointers that the docs depend on: external
# links in docs/, Discord invites, GitHub repositories, and redirects. It never
# fails the build. It keeps one rolling issue (label: link-health) up to date
# instead. See "Link health" in CONTRIBUTING.md.

on:
  schedule:
    - cron: '23 6 * * 1' # Mondays, 06:23 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/link-health.yml'
      - '.github/link-health/**'
      - 'scripts/link-health/**'

permissions:
  contents: read

concurrency:
  group: link-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout App Repo
        uses: actions/checkout@v7.0.1
        with:
          # Full history: the redirect check reads every past routes.txt.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Test the link-health scripts
        run: node --test 'scripts/link-health/*.test.mjs'

      - name: Check redirects
        continue-on-error: true
        run: node scripts/link-health/redirects.mjs --json link-health/redirects.json

      - name: Check Discord invites and GitHub repositories
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/link-health/pointers.mjs --json link-health/pointers.json

      - name: Restore the link cache
        uses: actions/cache@v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-

      - name: Check external links
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --config .github/link-health/lychee.toml
            --root-dir ${{ github.workspace }}/static
            'docs/**/*.md' 'docs/**/*.mdx'
          format: json
          output: link-health/lychee.json
          fail: false
          failIfEmpty: false
          jobSummary: false

      - name: Build the report
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/link-health/report.mjs \
            --lychee link-health/lychee.json \
            --pointers link-health/pointers.json \
            --redirects link-health/redirects.json \
            --out link-health/report.md \
            --status link-health/status.json \
            --run-url "$RUN_URL"
          cat link-health/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: link-health
          path: link-health/
          retention-days: 30

  issue:
    # Pull requests run the checks as a dry run. Only scheduled and manual runs
    # on main write the issue.
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout App Repo
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: scripts/link-health

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Download the report
        uses: actions/download-artifact@v8.0.2
        with:
          name: link-health
          path: link-health

      - name: Update the rolling issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/link-health/issue.mjs \
            --report link-health/report.md \
            --status link-health/status.json \
            --run-url "$RUN_URL"
