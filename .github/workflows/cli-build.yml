name: Validate Stellar CLI docs

# Called from stellar/stellar-cli (its docs.yml) to check that a CLI commit's
# FULL_HELP_DOCS.md and cookbook build cleanly on the Mintlify site. Renaming
# this file or its stellar-cli-ref input breaks that caller.
on:
  workflow_call:
    inputs:
      stellar-cli-ref:
        required: false
        default: ''
        type: string
        description: "stellar-cli ref to build against. If empty, uses the latest CLI release tag."
      stellar-docs-ref:
        required: false
        default: ''
        type: string
        description: "stellar-docs ref to build with. If empty, uses the default branch. Set this when calling the workflow from a branch other than main."

  workflow_dispatch:
    inputs:
      stellar-cli-ref:
        required: false
        default: ''
        type: string
        description: "stellar-cli ref to build against. If empty, uses the latest CLI release tag."

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout App Repo
        uses: actions/checkout@v7.0.1
        with:
          repository: stellar/stellar-docs
          # Called from another repo, checkout defaults to stellar-docs' default
          # branch, not the ref this workflow file was loaded from.
          ref: ${{ inputs.stellar-docs-ref }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Enable Corepack
        run: corepack enable

      - name: Install App Dependencies
        run: pnpm install --prefer-offline --frozen-lockfile

      - name: Copy Files From Stellar CLI
        env:
          CLI_REF: ${{ inputs.stellar-cli-ref }}
        run: |
          if [ -n "$CLI_REF" ]; then
            node scripts/stellar_cli.mjs --cli-ref "$CLI_REF"
          else
            node scripts/stellar_cli.mjs
          fi

      - name: Validate the Mintlify build
        run: pnpm validate

      - name: Check links
        # Known broken links remain elsewhere on the site (see
        # mintlify-fast-follow.md), so this reports without failing the job.
        continue-on-error: true
        run: pnpm check:links
