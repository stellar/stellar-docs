name: Format MDX and validate the Mintlify build

on:
  pull_request:
    branches:
      - main
      - mintlify-migration

  workflow_dispatch:

permissions:
  contents: read

jobs:
  complete:
    if: always()
    needs: [ checks ]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout App Repo
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # Two commits deep, so the link-style step can diff against the base
          # (HEAD^1 is the base branch's tip in a pull request's merge commit).
          fetch-depth: 2

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Enable Corepack
        run: corepack enable

      - name: Install App Dependencies
        run: pnpm install --prefer-offline --frozen-lockfile

      - name: Check MDX formatting
        run: git update-index -g && pnpm ci:mdx

      - name: Show Diff if Prettier Fails
        if: ${{ failure() }}
        run: pnpm diff:mdx && echo "::error::Prettier static analysis failed"

      - name: Check blank lines around component tags
        run: pnpm check:pad

      - name: Check the link style of added lines
        # Root-relative links without .mdx. Only lines this PR adds or changes,
        # so the existing links can be converted section by section.
        run: node scripts/check-link-style.mjs --base HEAD^1

      - name: Check the OpenRPC specs and method pages are up to date
        run: pnpm rpcspec:check

      - name: Validate the Mintlify build
        run: pnpm validate

      - name: Check links
        # Site pages through mint broken-links, and the agent skills in
        # .mintlify/skills/ through scripts/check-skill-links.mjs, since
        # Mintlify serves those as raw Markdown rather than pages.
        run: pnpm check:links
