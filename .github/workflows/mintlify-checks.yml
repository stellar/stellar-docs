name: Format MDX and validate the Mintlify build

on:
  pull_request:
    branches:
      - main
      - mintlify-migration

  workflow_dispatch:

permissions:
  contents: read

jobs:
  complete:
    if: always()
    needs: [ checks ]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout App Repo
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Enable Corepack
        run: corepack enable

      - name: Install App Dependencies
        run: pnpm install --prefer-offline --frozen-lockfile

      - name: Check MDX formatting
        run: git update-index -g && pnpm ci:mdx

      - name: Show Diff if Prettier Fails
        if: ${{ failure() }}
        run: pnpm diff:mdx && echo "::error::Prettier static analysis failed"

      - name: Check blank lines around component tags
        run: pnpm check:pad

      - name: Validate the Mintlify build
        run: pnpm validate

      - name: Check links
        # Known broken links remain (see mintlify-fast-follow.md), so this
        # reports without failing the job until they're fixed.
        continue-on-error: true
        run: pnpm check:links
