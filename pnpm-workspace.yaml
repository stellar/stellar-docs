minimumReleaseAge: 4320
blockExoticSubdeps: true
strictDepBuilds: true

allowBuilds:
  '@scarf/scarf': false   # install telemetry
  esbuild: true           # needed by mint dev
  keytar: false           # OS keychain, only for `mint login`
  sharp: false            # mint dev works without it

trustPolicy: no-downgrade
trustPolicyExclude:
  - 'detect-port@1.6.1'
  - 'semver@6.3.1'
